<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JADE CHAMBER | Trang sức</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="./assets/css/Trangchu.css">
    <link rel="stylesheet" href="./assets/css/DaQuy.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibe&family=Allura&family=Parisienne&family=Playfair+Display:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="./assets/js/layout.js"></script>
</head>
<body>
    <app-header></app-header>

    <!-- Breadcrum -->
    <div class="breadcrumb-wrapper">
        <div class="container-fluid px-lg-5">
            <nav aria-label="breadcrumb" class="py-3">
                <ol class="breadcrumb mb-0" id="dynamic-breadcrumb">
                    <li class="breadcrumb-item">
                        <a href="index.html" class="text-decoration-none text-muted">
                            <i class="fas fa-home me-1"></i> Trang chủ
                        </a>
                    </li>
                </ol>
            </nav>
        </div>
    </div>
    <script src="./assets/js/breadcrumb.js"></script>

    <div class="container-fluid px-lg-5 my-5">
        <div class="row">
            <aside class="col-lg-3">
                <div class="sidebar-filter shadow-sm">
                    <h5 class="filter-title"><i class="fas fa-th-list me-2"></i> DANH MỤC</h5>
                    <ul class="list-unstyled category-list">
                        <li><a href="#" onclick="event.preventDefault(); filterCat('NhanDon')">Nhẫn đơn</a></li>
                        <li><a href="#" onclick="event.preventDefault(); filterCat('DayChuyen')">Dây chuyền</a></li>
                        <li><a href="#" onclick="event.preventDefault(); filterCat('BongTai')">Bông tai</a></li>
                        <li><a href="#" onclick="event.preventDefault(); filterCat('LacTay')">Lắc tay</a></li>
                        <li><a href="#" onclick="event.preventDefault(); filterCat('NhanCuoi')">Nhẫn cưới</a></li>
                        <hr>
                        <li><a href="#" onclick="event.preventDefault(); filterCat('All')">Tất cả sản phẩm</a></li>
                    </ul>
                </div>
            </aside>

            <main class="col-lg-9">
                <div class="sort-bar d-flex align-items-center justify-content-between mb-4 shadow-sm p-3 bg-white">
                    <div class="d-flex align-items-center">
                        <span class="me-3 fw-bold">Sắp xếp theo:</span>
                        <button class="btn btn-sort">Phổ biến</button>
                        <button class="btn btn-sort">Mới nhất</button>
                        <button class="btn btn-sort">Bán chạy</button>
                    </div>
                    <div class="price-filter">
                        <select class="form-select form-select-sm" id="price-sort-select" onchange="applySortAndRender()">
                            <option value="default">Sắp xếp: Mặc định</option>
                            <option value="asc">Giá: Thấp đến Cao</option>
                            <option value="desc">Giá: Cao đến Thấp</option>
                        </select>
                    </div>
                </div>

                <div class="row g-4" id="product-display-grid">
                    </div>
            </main>
        </div>
    </div>

    <app-footer></app-footer>
    <app-globals></app-globals>
    <script src="./assets/js/cart.js"></script>
    <script src="./assets/js/products.js"></script>
    <script src="./assets/js/app.js"></script>
    <script src="./assets/js/search-overlay.js"></script>
</body>
</html>
