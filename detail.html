<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>JADE CHAMBER | Chi tiết sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="./assets/css/Trangchu.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibe&family=Allura&family=Parisienne&family=Playfair+Display:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="./assets/js/layout.js"></script>
  </head>
  <body>
    <app-header></app-header>
    
    <main class="container my-5">
        <div id="product-detail-container">
            <!-- Product details will be rendered here by JavaScript -->
        </div>
    </main>

    <app-footer></app-footer>
    <app-globals></app-globals>

    <script src="./assets/js/products.js"></script>
    <script src="./assets/js/cart.js"></script>
    <script src="./assets/js/search.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = parseInt(urlParams.get('id'));

            const product = gemProducts.find(p => p.id === productId);

            if (product) {
                const container = document.getElementById('product-detail-container');
                container.innerHTML = `
                    <div class="row">
                        <div class="col-md-6">
                            <img src="${product.imgMain}" alt="${product.name}" class="img-fluid rounded">
                        </div>
                        <div class="col-md-6">
                            <h2>${product.name}</h2>
                            <p class="fs-4 text-danger">${product.price ? product.price.toLocaleString() + 'đ' : 'Giá liên hệ'}</p>
                            <p><strong>Loại sản phẩm:</strong> ${product.category.join(', ')}</p>
                            <p><strong>Danh mục phụ:</strong> ${product.subCategory.join(', ')}</p>
                            <div class="d-grid gap-2">
                                <button class="btn btn-primary" onclick="addToCartById(${product.id})">Thêm vào giỏ hàng</button>
                                <a href="checkout.html" class="btn btn-success" onclick="addToCartById(${product.id})">Mua ngay</a>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                const container = document.getElementById('product-detail-container');
                container.innerHTML = '<p>Sản phẩm không tồn tại.</p>';
            }
        });

        function addToCartById(productId) {
            const product = gemProducts.find(p => p.id === productId);
            if(product) {
                addToCart(product.name, product.price, product.imgMain);
            }
        }
    </script>
  </body>
</html>
