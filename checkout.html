<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanh toán - JADE CHAMBER</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="./assets/css/Trangchu.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="assets/img/ItemAboutUs/JadeChamber.ico"
    />

    <script src="./assets/js/layout.js"></script>
  </head>
  <body class="bg-light">
    <app-header></app-header>

    <main class="container py-5">
      <div class="text-center mb-5">
        <h2
          class="display-5 fw-bold"
          style="
            color: #d4af37;
            font-family: &quot;Playfair Display&quot;, serif;
          "
        >
          Thanh toán đơn hàng
        </h2>
        <p class="lead text-muted">
          Vui lòng điền thông tin để Jade Chamber giao hàng đến bạn.
        </p>
      </div>

      <div class="row g-5">
        <div class="col-md-5 col-lg-4 order-md-last">
          <h4 class="d-flex justify-content-between align-items-center mb-3">
            <span style="color: #000c1d; font-weight: bold"
              >Giỏ hàng của bạn</span
            >
            <span
              class="badge rounded-pill"
              style="background-color: #d4af37"
              id="checkout-cart-count"
              >0</span
            >
          </h4>
          <ul class="list-group mb-3 shadow-sm" id="checkout-item-list"></ul>
          <div class="card shadow-sm border-0 mb-3">
            <div class="card-body">
              <div class="input-group">
                <input
                  type="text"
                  class="form-control"
                  id="discountCode"
                  placeholder="Nhập mã giảm giá (VD: JADE15)"
                />
                <button
                  type="button"
                  class="btn text-white fw-bold"
                  onclick="applyDiscount()"
                  style="background-color: #000c1d"
                >
                  ÁP DỤNG
                </button>
              </div>
              <small id="discountMessage" class="mt-2 d-none"></small>
            </div>
          </div>

          <div class="card shadow-sm border-0">
            <div class="card-body">
              <div
                class="d-flex justify-content-between align-items-center mb-2"
              >
                <span class="text-muted">Tạm tính:</span>
                <span class="text-muted fw-bold" id="checkout-subtotal"
                  >0đ</span
                >
              </div>

              <div
                class="d-flex justify-content-between align-items-center mb-2 d-none"
                id="discount-row"
              >
                <span class="text-success">Giảm giá:</span>
                <span class="text-success fw-bold" id="checkout-discount-amount"
                  >-0đ</span
                >
              </div>

              <hr />
              <div class="d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold">Tổng cộng:</h5>
                <h5 class="mb-0 fw-bold text-danger" id="checkout-total-price">
                  0đ
                </h5>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-7 col-lg-8">
          <div class="card shadow-sm border-0 p-4">
            <h4 class="mb-3 fw-bold">Thông tin giao hàng</h4>

            <form
              class="needs-validation"
              id="checkoutForm"
              onsubmit="return placeOrder(event);"
            >
              <div class="row g-3">
                <div class="col-12">
                  <label for="fullName" class="form-label"
                    >Họ và tên <span class="text-danger">*</span></label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="fullName"
                    placeholder="VD: Trần Lê Minh"
                    required
                  />
                </div>

                <div class="col-md-6">
                  <label for="email" class="form-label">Email</label>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="you@example.com"
                  />
                </div>

                <div class="col-md-6">
                  <label for="phone" class="form-label"
                    >Số điện thoại <span class="text-danger">*</span></label
                  >
                  <input
                    type="tel"
                    class="form-control"
                    id="phone"
                    placeholder="03xx-xxx-xxx"
                    required
                  />
                </div>

                <div class="col-md-4">
                  <label for="city" class="form-label"
                    >Tỉnh / Thành phố <span class="text-danger">*</span></label
                  >
                  <select class="form-select" id="city" required>
                    <option value="">Chọn Tỉnh/Thành</option>
                    <option value="Hà Nội">Hà Nội</option>
                    <option value="TP. Hồ Chí Minh">TP. Hồ Chí Minh</option>
                    <option value="Đà Nẵng">Đà Nẵng</option>
                  </select>
                </div>

                <div class="col-12">
                  <label for="address" class="form-label"
                    >Địa chỉ nhận hàng chi tiết
                    <span class="text-danger">*</span></label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="address"
                    placeholder="Số nhà, Tên đường, Phường/Xã,..."
                    required
                  />
                </div>
              </div>

              <hr class="my-4" />

              <h4 class="mb-3 fw-bold">Phương thức thanh toán</h4>
              <div class="my-3">
                <div class="form-check mb-2">
                  <input
                    id="cod"
                    name="paymentMethod"
                    type="radio"
                    class="form-check-input"
                    checked
                    required
                  />
                  <label class="form-check-label" for="cod"
                    >Thanh toán khi nhận hàng (COD)</label
                  >
                </div>
                <div class="form-check">
                  <input
                    id="bank"
                    name="paymentMethod"
                    type="radio"
                    class="form-check-input"
                    required
                  />
                  <label class="form-check-label" for="bank"
                    >Chuyển khoản qua ngân hàng</label
                  >
                </div>
              </div>

              <div class="col-12">
                <label for="note" class="form-label"
                  >Ghi chú giao hàng (Tùy chọn)</label
                >
                <textarea
                  class="form-control"
                  id="note"
                  rows="2"
                  placeholder="Ví dụ: Giao hàng vào giờ hành chính..."
                ></textarea>
              </div>

              <hr class="my-4" />
              <button
                class="w-100 btn btn-lg py-3 fw-bold text-white"
                type="submit"
                style="background-color: #000c1d"
              >
                XÁC NHẬN ĐẶT HÀNG
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>

    <app-footer></app-footer>
    <app-globals></app-globals>

    <script src="./assets/js/cart.js"></script>
    <script src="./assets/js/search.js"></script>

    <script>
      // Biến toàn cục để lưu tiền và mức giảm giá
      let globalSubtotal = 0;
      let appliedDiscount = 0;

      document.addEventListener("DOMContentLoaded", () => {
        const cart =
          JSON.parse(localStorage.getItem("jade_chamber_cart")) || [];
        const checkoutList = document.getElementById("checkout-item-list");
        const checkoutCount = document.getElementById("checkout-cart-count");

        let count = 0;

        if (cart.length === 0) {
          checkoutList.innerHTML =
            '<li class="list-group-item text-center">Giỏ hàng đang trống</li>';
          updateTotalUI();
          return;
        }

        checkoutList.innerHTML = cart
          .map((item) => {
            let itemTotal = item.price * item.quantity;
            globalSubtotal += itemTotal; // Cộng dồn vào tạm tính
            count += item.quantity;
            return `
        <li class="list-group-item d-flex justify-content-between lh-sm">
            <div>
                <h6 class="my-0">${item.name}</h6>
                <small class="text-muted">Số lượng: ${item.quantity}</small>
            </div>
            <span class="text-muted">${itemTotal.toLocaleString("vi-VN")}đ</span>
        </li>`;
          })
          .join("");

        if (checkoutCount) checkoutCount.innerText = count;
        updateTotalUI(); // Cập nhật giao diện tiền
      });

      // HÀM MỚI 1: CẬP NHẬT GIAO DIỆN TỔNG TIỀN
      function updateTotalUI() {
        const subtotalEl = document.getElementById("checkout-subtotal");
        const totalEl = document.getElementById("checkout-total-price");
        const discountRow = document.getElementById("discount-row");
        const discountAmountEl = document.getElementById(
          "checkout-discount-amount",
        );

        // Hiện Tạm tính
        if (subtotalEl)
          subtotalEl.innerText = globalSubtotal.toLocaleString("vi-VN") + "đ";

        // Tính tổng tiền cuối cùng
        let finalTotal = globalSubtotal - appliedDiscount;
        if (finalTotal < 0) finalTotal = 0; // Tránh trường hợp tiền bị âm

        // Hiện/Ẩn dòng Giảm giá
        if (appliedDiscount > 0) {
          discountRow.classList.remove("d-none");
          discountAmountEl.innerText =
            "-" + appliedDiscount.toLocaleString("vi-VN") + "đ";
        } else {
          discountRow.classList.add("d-none");
        }

        // Hiện Tổng cộng
        if (totalEl)
          totalEl.innerText = finalTotal.toLocaleString("vi-VN") + "đ";
      }

      // HÀM MỚI 2: XỬ LÝ KHI BẤM NÚT "ÁP DỤNG"
      function applyDiscount() {
        // Lấy mã khách nhập và in hoa toàn bộ để dễ so sánh
        const codeInput = document
          .getElementById("discountCode")
          .value.trim()
          .toUpperCase();
        const msgEl = document.getElementById("discountMessage");

        if (!codeInput) {
          msgEl.innerText = "Vui lòng nhập mã giảm giá.";
          msgEl.className = "text-danger mt-2 d-block small";
          appliedDiscount = 0;
          updateTotalUI();
          return;
        }

        // Kho mã giảm giá (Bạn có thể thêm bớt ở đây)
        if (codeInput === "JADE15") {
          appliedDiscount = globalSubtotal * 0.15; // Giảm 15%
          msgEl.innerText = "Áp dụng mã thành công! Giảm 15% tổng đơn.";
          msgEl.className = "text-success mt-2 d-block fw-bold small";
        } else if (codeInput === "VIP200") {
          appliedDiscount = 200000; // Giảm 200.000đ
          msgEl.innerText = "Áp dụng mã thành công! Giảm trực tiếp 200.000đ.";
          msgEl.className = "text-success mt-2 d-block fw-bold small";
        } else {
          appliedDiscount = 0;
          msgEl.innerText = "Mã giảm giá không hợp lệ hoặc đã hết hạn.";
          msgEl.className = "text-danger mt-2 d-block small";
        }

        // Tính lại tiền sau khi áp mã
        updateTotalUI();
      }

      // Hàm xử lý đặt hàng giữ nguyên
      function placeOrder(event) {
        event.preventDefault();
        const name = document.getElementById("fullName").value;
        alert("Cảm ơn " + name + "! Đơn hàng của bạn đã được đặt thành công.");
        localStorage.removeItem("jade_chamber_cart");
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
