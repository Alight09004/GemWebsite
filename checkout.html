<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanh toán - JADE CHAMBER</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="./assets/css/Trangchu.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="assets/img/ItemAboutUs/JadeChamber.ico"
    />

    <script src="./assets/js/layout.js"></script>
  </head>
  <body class="bg-light">
    <app-header></app-header>

    <main class="container py-5">
      <div class="text-center mb-5">
        <h2
          class="display-5 fw-bold"
          style="
            color: #d4af37;
            font-family: &quot;Playfair Display&quot;, serif;
          "
        >
          Thanh toán đơn hàng
        </h2>
        <p class="lead text-muted">
          Vui lòng điền thông tin để Jade Chamber giao hàng đến bạn.
        </p>
      </div>

      <div class="row g-5">
        <div class="col-md-5 col-lg-4 order-md-last">
          <h4 class="d-flex justify-content-between align-items-center mb-3">
            <span style="color: #000c1d; font-weight: bold"
              >Giỏ hàng của bạn</span
            >
            <span
              class="badge rounded-pill"
              style="background-color: #d4af37"
              id="checkout-cart-count"
              >0</span
            >
          </h4>
          <ul class="list-group mb-3 shadow-sm" id="checkout-item-list"></ul>
          <div class="card shadow-sm border-0 mb-3">
            <div class="card-body">
              <div class="input-group">
                <input
                  type="text"
                  class="form-control"
                  id="discountCode"
                  placeholder="Nhập mã giảm giá (VD: JADE15)"
                />
                <button
                  type="button"
                  class="btn text-white fw-bold"
                  onclick="applyDiscount()"
                  style="background-color: #000c1d"
                >
                  ÁP DỤNG
                </button>
              </div>
              <small id="discountMessage" class="mt-2 d-none"></small>
            </div>
          </div>

          <div class="card shadow-sm border-0">
            <div class="card-body">
              <div
                class="d-flex justify-content-between align-items-center mb-2"
              >
                <span class="text-muted">Tạm tính:</span>
                <span class="text-muted fw-bold" id="checkout-subtotal"
                  >0đ</span
                >
              </div>

              <div
                class="d-flex justify-content-between align-items-center mb-2 d-none"
                id="discount-row"
              >
                <span class="text-success">Giảm giá:</span>
                <span class="text-success fw-bold" id="checkout-discount-amount"
                  >-0đ</span
                >
              </div>

              <hr />
              <div class="d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold">Tổng cộng:</h5>
                <h5 class="mb-0 fw-bold text-danger" id="checkout-total-price">
                  0đ
                </h5>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-7 col-lg-8">
          <div class="card shadow-sm border-0 p-4">
            <h4 class="mb-3 fw-bold">Thông tin giao hàng</h4>

            <form
              class="needs-validation"
              id="checkoutForm"
              onsubmit="return placeOrder(event);"
            >
              <div class="row g-3">
                <div class="col-12">
                  <label for="fullName" class="form-label"
                    >Họ và tên <span class="text-danger">*</span></label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="fullName"
                    placeholder="VD: Trần Lê Minh"
                    required
                  />
                </div>

                <div class="col-md-6">
                  <label for="email" class="form-label">Email</label>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="name@gmail.com"
                  />
                </div>

                <div class="col-md-6">
                  <label for="phone" class="form-label"
                    >Số điện thoại <span class="text-danger">*</span></label
                  >
                  <input
                    type="tel"
                    class="form-control"
                    id="phone"
                    placeholder="03xxxxxxx"
                    required
                  />
                </div>

                <div class="col-md-4">
                  <label for="city" class="form-label"
                    >Tỉnh / Thành phố <span class="text-danger">*</span></label
                  >
                  <select class="form-select" id="city" required>
                    <option value="">Chọn Tỉnh/Thành</option>
                    <option value="Thành phố Hà Nội">Thành phố Hà Nội</option>
                    <option value="Thành phố Huế">Thành phố Huế</option>
                    <option value="Tỉnh Quảng Ninh">Tỉnh Quảng Ninh</option>
                    <option value="Tỉnh Cao Bằng">Tỉnh Cao Bằng</option>
                    <option value="Tỉnh Lạng Sơn">Tỉnh Lạng Sơn</option>
                    <option value="Tỉnh Lai Châu">Tỉnh Lai Châu</option>
                    <option value="Tỉnh Điện Biên">Tỉnh Điện Biên</option>
                    <option value="Tỉnh Sơn La">Tỉnh Sơn La</option>
                    <option value="Tỉnh Thanh Hóa">Tỉnh Thanh Hóa</option>
                    <option value="Tỉnh Nghệ An">Tỉnh Nghệ An</option>
                    <option value="Tỉnh Hà Tĩnh">Tỉnh Hà Tĩnh</option>
                    <option value="Tỉnh Tuyên Quang">Tỉnh Tuyên Quang</option>
                    <option value="Tỉnh Lào Cai">Tỉnh Lào Cai</option>
                    <option value="Tỉnh Thái Nguyên">Tỉnh Thái Nguyên</option>
                    <option value="Tỉnh Phú Thọ">Tỉnh Phú Thọ</option>
                    <option value="Tỉnh Bắc Ninh">Tỉnh Bắc Ninh</option>
                    <option value="Tỉnh Hưng Yên">Tỉnh Hưng Yên</option>
                    <option value="Thành phố Hải Phòng">
                      Thành phố Hải Phòng
                    </option>
                    <option value="Tỉnh Ninh Bình">Tỉnh Ninh Bình</option>
                    <option value="Tỉnh Quảng Trị">Tỉnh Quảng Trị</option>
                    <option value="Thành phố Đà Nẵng">Thành phố Đà Nẵng</option>
                    <option value="Tỉnh Quảng Ngãi">Tỉnh Quảng Ngãi</option>
                    <option value="Tỉnh Gia Lai">Tỉnh Gia Lai</option>
                    <option value="Tỉnh Khánh Hòa">Tỉnh Khánh Hòa</option>
                    <option value="Tỉnh Lâm Đồng">Tỉnh Lâm Đồng</option>
                    <option value="Tỉnh Đắk Lắk">Tỉnh Đắk Lắk</option>
                    <option value="Thành phố Hồ Chí Minh">
                      Thành phố Hồ Chí Minh
                    </option>
                    <option value="Tỉnh Đồng Nai">Tỉnh Đồng Nai</option>
                    <option value="Tỉnh Tây Ninh">Tỉnh Tây Ninh</option>
                    <option value="Thành phố Cần Thơ">Thành phố Cần Thơ</option>
                    <option value="Tỉnh Vĩnh Long">Tỉnh Vĩnh Long</option>
                    <option value="Tỉnh Đồng Tháp">Tỉnh Đồng Tháp</option>
                    <option value="Tỉnh Cà Mau">Tỉnh Cà Mau</option>
                    <option value="Tỉnh An Giang">Tỉnh An Giang</option>
                  </select>
                </div>

                <div class="col-12">
                  <label for="address" class="form-label"
                    >Địa chỉ nhận hàng chi tiết
                    <span class="text-danger">*</span></label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="address"
                    placeholder="Số nhà, Tên đường, Phường/Xã,..."
                    required
                  />
                </div>
              </div>

              <hr class="my-4" />

              <h4 class="mb-3 fw-bold">Phương thức thanh toán</h4>
              <div class="my-3">
                <div class="form-check mb-2">
                  <input
                    id="cod"
                    name="paymentMethod"
                    type="radio"
                    class="form-check-input"
                    checked
                    required
                  />
                  <label class="form-check-label" for="cod"
                    >Thanh toán khi nhận hàng (COD)</label
                  >
                </div>

                <div class="form-check mb-2">
                  <input
                    id="bank"
                    name="paymentMethod"
                    type="radio"
                    class="form-check-input"
                    required
                  />
                  <label class="form-check-label" for="bank"
                    >Chuyển khoản qua ngân hàng</label
                  >
                </div>

                <div class="form-check">
                  <input
                    id="ewallet"
                    name="paymentMethod"
                    type="radio"
                    class="form-check-input"
                    required
                  />
                  <label class="form-check-label" for="ewallet">
                    Thanh toán qua ví điện tử (VNPay / ZaloPay)
                    <i class="fas fa-qrcode ms-1" style="color: #000c1d"></i>
                  </label>
                </div>
              </div>

              <div class="col-12">
                <label for="note" class="form-label"
                  >Ghi chú giao hàng (Tùy chọn)</label
                >
                <textarea
                  class="form-control"
                  id="note"
                  rows="2"
                  placeholder="Ví dụ: Giao hàng vào giờ hành chính..."
                ></textarea>
              </div>

              <hr class="my-4" />
              <button
                class="w-100 btn btn-lg py-3 fw-bold text-white"
                type="submit"
                style="background-color: #000c1d"
              >
                XÁC NHẬN ĐẶT HÀNG
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>

    <app-footer></app-footer>
    <app-globals></app-globals>

    <script src="./assets/js/cart.js"></script>

    <script>
      let globalSubtotal = 0;
      let appliedDiscount = 0;

      // 1. Chạy ngay khi trang vừa tải xong
      document.addEventListener("DOMContentLoaded", () => {
        loadCheckoutCart();
      });

      // 2. HÀM VẼ LẠI GIỎ HÀNG (Có thêm nút + / - / Xóa)
      function loadCheckoutCart() {
        const cart =
          JSON.parse(localStorage.getItem("jade_chamber_cart")) || [];
        const checkoutList = document.getElementById("checkout-item-list");
        const checkoutCount = document.getElementById("checkout-cart-count");

        globalSubtotal = 0;
        let count = 0;

        // Nếu giỏ hàng trống
        if (cart.length === 0) {
          checkoutList.innerHTML =
            '<li class="list-group-item text-center py-4 text-muted">Giỏ hàng đang trống</li>';
          if (checkoutCount) checkoutCount.innerText = "0";
          recalculateDiscount();
          updateTotalUI();
          return;
        }

        // Vẽ danh sách sản phẩm
        checkoutList.innerHTML = cart
          .map((item, index) => {
            let itemPrice = item.price || 0;
            let itemTotal = itemPrice * item.quantity;
            globalSubtotal += itemTotal;
            count += item.quantity;

            return `
            <li class="list-group-item d-flex justify-content-between align-items-center lh-sm py-3">
                <div class="me-3" style="width: 65px; height: 65px; flex-shrink: 0;">
                    <img src="${item.img}" alt="${item.name}" 
                         style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px; border: 1px solid #eee;" 
                         onerror="this.src='./assets/img/ItemTrangChu(1)/default.jpg'">
                </div>

                <div class="flex-grow-1 me-3">
                    <h6 class="my-0 mb-2" style="font-size: 14px; line-height: 1.4; color: #000c1d;">${item.name}</h6>
                    
                    <div class="d-flex align-items-center gap-2 mt-2">
                        <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="changeCheckoutQty(${index}, -1)">-</button>
                        
                        <input type="number" class="form-control form-control-sm text-center fw-bold px-1" 
                               style="width: 50px; height: 28px; hide-arrows" 
                               value="${item.quantity}" min="1" 
                               onchange="inputCheckoutQty(${index}, this.value)">
                        
                        <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="changeCheckoutQty(${index}, 1)">+</button>
                        
                        <button type="button" class="btn btn-sm text-danger p-0 ms-3 border-0 bg-transparent" onclick="removeCheckoutItem(${index})" title="Xóa">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>

            <span class="text-muted fw-bold" style="white-space: nowrap;">${itemTotal > 0 ? itemTotal.toLocaleString("vi-VN") + 'đ' : 'Liên hệ'}</span>
            </li>`;
          })
          .join("");

        if (checkoutCount) checkoutCount.innerText = count;

        recalculateDiscount(); // Tính lại mã giảm giá nếu khách hàng thay đổi số lượng
        updateTotalUI(); // Cập nhật tổng tiền
      }

      // 3. HÀM XỬ LÝ NÚT CỘNG / TRỪ
      function changeCheckoutQty(index, delta) {
        let currentCart =
          JSON.parse(localStorage.getItem("jade_chamber_cart")) || [];
        if (currentCart[index]) {
          currentCart[index].quantity += delta;

          // Nếu giảm xuống 0 thì hỏi có muốn xóa không
          if (currentCart[index].quantity <= 0) {
            if (confirm("Bạn có muốn xóa sản phẩm này khỏi đơn hàng?")) {
              currentCart.splice(index, 1);
            } else {
              currentCart[index].quantity = 1; // Hủy thì giữ nguyên 1
            }
          }

          // Lưu dữ liệu và vẽ lại
          localStorage.setItem(
            "jade_chamber_cart",
            JSON.stringify(currentCart),
          );
          loadCheckoutCart();
          syncHeaderCart(currentCart); // Đồng bộ logo giỏ hàng trên thanh Menu
        }
      }

      // HÀM XỬ LÝ KHI KHÁCH HÀNG NHẬP SỐ TRỰC TIẾP
      function inputCheckoutQty(index, newQty) {
        let currentCart =
          JSON.parse(localStorage.getItem("jade_chamber_cart")) || [];

        if (currentCart[index]) {
          // Ép kiểu chữ người dùng nhập thành số nguyên
          let qty = parseInt(newQty);

          // Bắt lỗi: Nếu khách nhập số 0, số âm, hoặc cố tình xóa sạch ô nhập
          if (isNaN(qty) || qty <= 0) {
            if (confirm("Bạn có muốn xóa sản phẩm này khỏi đơn hàng?")) {
              currentCart.splice(index, 1);
            } else {
              currentCart[index].quantity = 1; // Khách hủy xóa thì tự động reset về 1
            }
          } else {
            // Nếu khách nhập số hợp lệ (VD: 100), cập nhật vào giỏ
            currentCart[index].quantity = qty;
          }

          // Lưu dữ liệu mới và vẽ lại toàn bộ giao diện tiền
          localStorage.setItem(
            "jade_chamber_cart",
            JSON.stringify(currentCart),
          );
          loadCheckoutCart();
          syncHeaderCart(currentCart);
        }
      }

      // HÀM XỬ LÝ NÚT XÓA (THÙNG RÁC)
      function removeCheckoutItem(index) {
        let currentCart =
          JSON.parse(localStorage.getItem("jade_chamber_cart")) || [];
        if (confirm("Bạn chắc chắn muốn xóa sản phẩm này?")) {
          currentCart.splice(index, 1);
          localStorage.setItem(
            "jade_chamber_cart",
            JSON.stringify(currentCart),
          );
          loadCheckoutCart();
          syncHeaderCart(currentCart);
        }
      }

      // ĐỒNG BỘ GIỎ HÀNG TRÊN NAVBAR
      function syncHeaderCart(updatedCart) {
        if (typeof window.cart !== "undefined") {
          window.cart = updatedCart;
          if (typeof updateCartDropdownUI === "function") {
            updateCartDropdownUI();
          }
        }
      }

      // CÁC HÀM TÍNH TIỀN
      function updateTotalUI() {
        const subtotalEl = document.getElementById("checkout-subtotal");
        const totalEl = document.getElementById("checkout-total-price");
        const discountRow = document.getElementById("discount-row");
        const discountAmountEl = document.getElementById(
          "checkout-discount-amount",
        );

        if (subtotalEl)
          subtotalEl.innerText = globalSubtotal.toLocaleString("vi-VN") + "đ";

        let finalTotal = globalSubtotal - appliedDiscount;
        if (finalTotal < 0) finalTotal = 0;

        if (appliedDiscount > 0) {
          discountRow.classList.remove("d-none");
          discountAmountEl.innerText =
            "-" + appliedDiscount.toLocaleString("vi-VN") + "đ";
        } else {
          discountRow.classList.add("d-none");
        }

        if (totalEl)
          totalEl.innerText = finalTotal.toLocaleString("vi-VN") + "đ";
      }

      // Hàm tính lại tiền giảm nếu khách đổi số lượng sản phẩm
      function recalculateDiscount() {
        const codeInput = document.getElementById("discountCode");
        if (!codeInput || !codeInput.value) {
          appliedDiscount = 0;
          return;
        }

        const code = codeInput.value.trim().toUpperCase();
        if (code === "JADE15") appliedDiscount = globalSubtotal * 0.15;
        else if (code === "VIP200") appliedDiscount = 200000;
        else if (code === "JADE05") appliedDiscount = globalSubtotal * 0.05;
        else if (code === "LIYUE") appliedDiscount = globalSubtotal * 0.85;
        else appliedDiscount = 0;
      }

      // Hàm áp dụng mã khi khách bấm nút ÁP DỤNG
      function applyDiscount() {
        const codeInput = document
          .getElementById("discountCode")
          .value.trim()
          .toUpperCase();
        const msgEl = document.getElementById("discountMessage");

        if (!codeInput) {
          msgEl.innerText = "Vui lòng nhập mã giảm giá.";
          msgEl.className = "text-danger mt-2 d-block small";
          appliedDiscount = 0;
          updateTotalUI();
          return;
        }

        recalculateDiscount();

        if (appliedDiscount > 0) {
          msgEl.innerText = "Áp dụng mã thành công!";
          msgEl.className = "text-success mt-2 d-block fw-bold small";
        } else {
          msgEl.innerText = "Mã không hợp lệ hoặc đã hết hạn.";
          msgEl.className = "text-danger mt-2 d-block small";
        }
        updateTotalUI();
      }

      // XÁC NHẬN ĐẶT HÀNG VÀ KIỂM TRA LỖI (VALIDATION)
      function placeOrder(event) {
        event.preventDefault();

        // Chặn không cho đặt nếu giỏ hàng trống
        if (globalSubtotal === 0) {
          alert("Giỏ hàng đang trống! Vui lòng chọn sản phẩm trước khi đặt.");
          return;
        }

        // Lấy giá trị từ các ô nhập liệu và xóa khoảng trắng dư thừa ở hai đầu (.trim())
        const name = document.getElementById("fullName").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const email = document.getElementById("email").value.trim();
        const address = document.getElementById("address").value.trim();
        const city = document.getElementById("city").value;

        // KIỂM TRA BỎ TRỐNG: Đảm bảo khách nhập đủ các ô có dấu *
        if (!name || !phone || !address || !city) {
          alert(
            "Vui lòng điền đầy đủ các thông tin giao hàng bắt buộc (có dấu *)!",
          );
          return;
        }

        // KIỂM TRA SỐ ĐIỆN THOẠI: Phải là số từ 0-9 và có độ dài đúng 10 hoặc 11 số
        const phoneRegex = /^[0-9]{10,11}$/;
        if (!phoneRegex.test(phone)) {
          alert(
            "Số điện thoại không hợp lệ! Vui lòng nhập đúng 10 hoặc 11 chữ số.",
          );
          document.getElementById("phone").focus(); // Tự động đưa con trỏ chuột nhấp nháy ở ô lỗi
          return; // Dừng lại, không cho đặt hàng
        }

        // KIỂM TRA EMAIL: Nếu khách có gõ chữ vào thì bắt buộc phải đúng định dạng có @ và dấu chấm
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (email !== "" && !emailRegex.test(email)) {
          alert(
            "Email không hợp lệ! Vui lòng nhập đúng định dạng (VD: nguyenvan_a@gmail.com).",
          );
          document.getElementById("email").focus(); // Tự động đưa con trỏ chuột về ô email
          return; // Dừng lại, không cho đặt hàng
        }

        // Nếu vượt qua toàn bộ các vòng kiểm tra trên, đơn hàng mới được xác nhận
        alert(
          "Cảm ơn " +
            name +
            "! Đơn hàng của bạn đã được hệ thống Jade Chamber ghi nhận.",
        );
        localStorage.removeItem("jade_chamber_cart");
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
