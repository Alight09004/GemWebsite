<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Kho | Luxury Gems</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">LUXURY <span>GEMS</span></a>
        <nav>
            <ul>
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="tasks.html" class="active">Quản lý</a></li>
                <li><a href="about.html">Thống kê</a></li>
            </ul>
        </nav>
    </header>

    <div class="container-custom">
        <h2 class="section-title">Hệ Thống Quản Lý Sản Phẩm</h2>
        
        <div class="row mb-4">
            <div class="col-md-8">
                <input type="text" id="searchInp" class="form-control" placeholder="Tìm kiếm trang sức..." onkeyup="handleFilter()">
            </div>
            <div class="col-md-4 text-end">
                <button class="btn-custom btn-gold" onclick="openAddModal()">+ Thêm Sản Phẩm</button>
            </div>
        </div>

        <div id="gemContainer" class="row">
            </div>
    </div>

    <div class="modal fade" id="gemModal" tabindex="-1">
        <div class="modal-dialog">
            <form id="gemForm" class="modal-content border-0 shadow">
                <div class="modal-header border-0 bg-light">
                    <h5 id="modalTitle" class="logo" style="font-size: 1.2rem;">Thêm <span>Mới</span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <input type="hidden" id="gemId">
                    <div class="mb-3">
                        <label class="fw-bold mb-2">Tên sản phẩm</label>
                        <input type="text" id="title" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="fw-bold mb-2">Mô tả chi tiết</label>
                        <textarea id="desc" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="fw-bold mb-2">Hạn định</label>
                            <input type="date" id="deadline" class="form-control" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="fw-bold mb-2">Ưu tiên</label>
                            <select id="priority" class="form-select">
                                <option value="Low">Thấp</option>
                                <option value="Medium">Trung bình</option>
                                <option value="High">Cao</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="p-3 text-center border-0">
                    <button type="submit" class="btn-custom btn-gold w-100">Xác Nhận Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/tasks.js"></script>
</body>
</html>
