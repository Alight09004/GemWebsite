<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>System Manager</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./assets/css/Trangchu.css" />
    <link rel="stylesheet" href="./assets/css/Tasks.css" />
  </head>

  <body>
    <div class="container-fluid">
      <div class="row">
        <!-- SIDEBAR -->

        <div class="col-md-2 sidebar p-3">
          <h4 class="logo">ADMIN</h4>

          <ul class="nav flex-column">
            <li class="nav-item">
              <a class="nav-link active" onclick="showPage('dashboard')"
                >Dashboard</a
              >
            </li>

            <li class="nav-item">
              <a class="nav-link" onclick="showPage('users')">Người dùng</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" onclick="showPage('orders')">Đơn hàng</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" onclick="showPage('settings')">Cài đặt</a>
            </li>
          </ul>

          <li class="nav-item">
            <button class="btn btn-secondary" onclick="logout()">
              <i class="fas fa-sign-out-alt me-2"></i>Đăng Xuất
            </button>
          </li>
          <script>
            function logout() {
              localStorage.removeItem("currentUser");
              window.location.href = "index.html";
            }
          </script>
        </div>

        <!-- CONTENT -->

        <div class="col-md-10 p-4 content">
          <!-- DASHBOARD -->

          <div id="dashboard" class="page">
            <h2>Dashboard</h2>

            <div class="row mt-4">
              <div class="col-md-4">
                <div class="card stat-card">
                  <div class="card-body">
                    <h5>Tổng người dùng</h5>
                    <p id="totalUsers">0</p>
                  </div>
                </div>
              </div>

              <div class="col-md-4">
                <div class="card stat-card">
                  <div class="card-body">
                    <h5>Tổng đơn hàng</h5>
                    <p id="totalOrders">0</p>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- USERS -->

          <div id="users" class="page d-none">
            <h2>Quản lý người dùng</h2>

            <div class="row mb-3">
              <div class="col">
                <input id="username" class="form-control" placeholder="Tên" />
              </div>

              <div class="col">
                <input id="email" class="form-control" placeholder="Email" />
              </div>

              <div class="col">
                <input id="role" class="form-control" placeholder="Vai trò" />
              </div>

              <div class="col">
                <input
                  id="password"
                  class="form-control"
                  placeholder="Mật khẩu"
                />
              </div>

              <div class="col">
                <button class="btn btn-gold" onclick="addUser()">Thêm</button>
              </div>
            </div>

            <table class="table table-bordered">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Tên</th>
                  <th>Mật khẩu</th>
                  <th>Email</th>
                  <th>Vai trò</th>
                  <th>Hành động</th>
                </tr>
              </thead>

              <tbody id="userTable"></tbody>
            </table>
          </div>

          <!-- ORDERS -->

          <div id="orders" class="page d-none">
            <h2>Quản lý đơn hàng</h2>

            <div class="row mb-3">
              <div class="col">
                <input
                  id="product"
                  class="form-control"
                  placeholder="Sản phẩm"
                />
              </div>

              <div class="col">
                <input id="price" class="form-control" placeholder="Giá" />
              </div>

              <div class="col">
                <button class="btn btn-gold" onclick="addOrder()">Thêm</button>
              </div>
            </div>

            <table class="table table-bordered">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Sản phẩm</th>
                  <th>Giá</th>
                  <th>Hành động</th>
                </tr>
              </thead>

              <tbody id="orderTable"></tbody>
            </table>
          </div>

          <!-- SETTINGS -->

          <div id="settings" class="page d-none">
            <h2>Cài đặt</h2>
            <div class="mb-3">
              <label class="form-label">Tên Website</label>
              <input
                type="name"
                class="form-control"
                id="siteName"
                placeholder="Tên website"
              />
            </div>
            <div class="mb-3">
              <label for="contactEmail" class="form-label">Email liên hệ</label>
              <input
                type="email"
                class="form-control"
                id="contactEmail"
                placeholder="Email liên hệ"
              />
            </div>
            <div class="mb-3">
              <label for="phoneNumber" class="form-label">Số điện thoại</label>
              <input
                type="text"
                class="form-control"
                id="phoneNumber"
                placeholder="Số điện thoại"
              />
            </div>
            <div class="mb-3">
              <label for="address" class="form-label">Địa chỉ</label>
              <textarea class="form-control" id="address" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <button class="btn btn-gold" onclick="saveSetting()">
                Lưu cài đặt
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./assets/js/tasks.js"></script>
  </body>
</html>
