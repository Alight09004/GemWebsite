<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>JADE CHAMBER | Giỏ hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="./assets/css/Trangchu.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibe&family=Allura&family=Parisienne&family=Playfair+Display:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="./assets/js/layout.js"></script>
    <script src="./assets/js/products.js"></script>
    <style>
        .cart-table th, .cart-table td { 
            vertical-align: middle;
        }
        .qty-input {
            width: 40px;
            height: 30px;
            padding: 0;
            text-align: center;
        }
        .btn-qty {
            width: 30px;
            height: 30px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .stock-info {
            font-size: 0.8rem;
            color: #28a745;
        }
        .order-history-item {
            border-left: 4px solid #D4AF37;
            background: #fcfcfc;
        }
        /* Tùy chỉnh Tab */
        .cart-tabs .nav-link {
            color: #001f3f;
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: bold;
            border: none;
            border-bottom: 3px solid transparent;
            padding: 10px 30px;
            background: transparent;
            transition: all 0.3s ease;
        }
        .cart-tabs .nav-link:hover {
            color: #D4AF37;
        }
        .cart-tabs .nav-link.active {
            color: #D4AF37;
            border-bottom: 3px solid #D4AF37;
            background: transparent;
        }
        .cart-tabs {
            border-bottom: 1px solid #dee2e6;
            margin-bottom: 30px;
        }
    </style>
</head>
<body class="bg-light" style="display: flex; flex-direction: column; min-height: 100vh;">
    <app-header></app-header>

    <div class="container my-5 flex-grow-1">
        <!-- Tabs -->
        <ul class="nav nav-tabs cart-tabs" id="cartTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="cart-tab" data-bs-toggle="tab" data-bs-target="#cart-content" type="button" role="tab" aria-controls="cart-content" aria-selected="true">
<i class="fas fa-shopping-cart me-2 fs-5"></i>Giỏ hàng
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="history-tab" data-bs-toggle="tab" data-bs-target="#history-content" type="button" role="tab" aria-controls="history-content" aria-selected="false">
                    <i class="fas fa-history me-2 fs-5"></i>Lịch sử mua hàng
                </button>
            </li>
        </ul>
        
        <!-- Tab Content -->
        <div class="tab-content" id="cartTabsContent">
            
            <!-- Tab: Giỏ hàng -->
            <div class="tab-pane fade show active" id="cart-content" role="tabpanel" aria-labelledby="cart-tab">
                <div class="row g-4">
                    <div class="col-lg-8">
                        <div class="card shadow-sm border-0 mb-4">
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table cart-table mb-0">
                                        <thead class="table-light">
                                            <tr>
                                                <th scope="col" class="ps-4"><input type="checkbox" id="selectAll" class="form-check-input" checked onchange="toggleAll()"></th>
                                                <th scope="col">Sản phẩm</th>
                                                <th scope="col">Đơn giá</th>
                                                <th scope="col">Số lượng</th>
                                                <th scope="col">Thành tiền</th>
                                                <th scope="col"></th>
                                            </tr>
                                        </thead>
                                        <tbody id="cart-page-items">
                                            <!-- Sản phẩm giỏ hàng hiển thị ở đây -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-4">
                        <div class="card shadow-sm border-0">
                            <div class="card-body p-4">
                                <h5 class="fw-bold mb-4" style="color: #001f3f;">Tổng đơn hàng</h5>
                                <div class="d-flex justify-content-between mb-3">
                                    <span class="text-muted">Tạm tính:</span>
                                    <span class="fw-bold" id="cart-subtotal">0đ</span>
                                </div>
                                <div class="mb-3 border-bottom pb-3">
<label class="form-label small text-muted">Mã giảm giá</label>
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="discountCode" placeholder="Nhập mã (VD: JADE10)">
                                        <button class="btn btn-outline-dark" type="button" onclick="applyDiscount()">Áp dụng</button>
                                    </div>
                                    <div id="discount-message" class="small mt-1 d-none text-success"></div>
                                </div>
                                <div class="d-flex justify-content-between mb-4 pt-1">
                                    <span class="fw-bold fs-5" style="color: #001f3f;">Tổng cộng:</span>
                                    <span class="fw-bold fs-5 text-danger" id="cart-total">0đ</span>
                                </div>
                                <button class="btn btn-dark w-100 py-3 fw-bold shadow-sm" style="background-color: #001f3f;" onclick="proceedToCheckout()">TIẾN HÀNH THANH TOÁN</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tab: Lịch sử mua hàng -->
            <div class="tab-pane fade" id="history-content" role="tabpanel" aria-labelledby="history-tab">
                <div class="alert alert-warning d-none shadow-sm" id="login-prompt">
                    <i class="fas fa-info-circle me-2"></i> Vui lòng <a href="login.html" class="alert-link">đăng nhập</a> để xem lịch sử mua hàng của bạn.
                </div>

                <div class="card shadow-sm border-0 d-none" id="history-section">
                    <div class="card-body p-4" id="history-list">
                        <!-- Đơn hàng lịch sử hiển thị ở đây -->
                    </div>
                </div>
            </div>

        </div>
    </div>
    <app-footer></app-footer>
    <app-globals></app-globals>
    <script src="./assets/js/cart.js"></script>
    <script src="./assets/js/checkout.js"></script>
</body>
</html>
